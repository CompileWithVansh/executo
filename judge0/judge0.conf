# ─────────────────────────────────────────────
#  Judge0 CE Configuration
#  Reference: https://github.com/judge0/judge0/blob/master/judge0.conf
# ─────────────────────────────────────────────

# ── Database ──────────────────────────────────
# Judge0 uses its own PostgreSQL database (separate from Executo's)
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password

# ── Redis ─────────────────────────────────────
REDIS_URL=redis://redis:6379

# ── Workers ───────────────────────────────────
# Number of concurrent submission workers
# Increase for higher throughput (requires more CPU/memory)
WORKERS=2

# ── Execution Limits ──────────────────────────
# Default CPU time limit in seconds (can be overridden per submission)
CPU_TIME_LIMIT=5

# Default wall clock time limit (includes I/O wait)
WALL_TIME_LIMIT=10

# Default memory limit in kilobytes (256 MB)
MEMORY_LIMIT=262144

# Default stack size limit in kilobytes (64 MB)
STACK_LIMIT=65536

# Maximum number of processes/threads
MAX_PROCESSES_AND_OR_THREADS=60

# Enable per-process and per-thread time limit
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false

# Enable per-process and per-thread memory limit
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# Maximum file size in kilobytes (1 MB)
MAX_FILE_SIZE=1024

# ── Security ──────────────────────────────────
# Disable authentication for self-hosted (enable in production)
AUTHN_HEADER=
AUTHN_TOKEN=

# ── Submission Queue ──────────────────────────
# Maximum queue size (0 = unlimited)
MAX_QUEUE_SIZE=100

# ── Logging ───────────────────────────────────
# Log level: debug, info, warn, error
LOG_LEVEL=info

# ── Callbacks ─────────────────────────────────
# Webhook URL called when a submission completes (optional)
# CALLBACKS_MAX_TRIES=3
# CALLBACKS_TIMEOUT=10

# ── Maintenance ───────────────────────────────
# Interval in seconds to clean up old submissions
MAINTENANCE_MODE=false
