# ─────────────────────────────────────────────
#  Executo — Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security Headers ──────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Rate Limiting ─────────────────────────
    # Limit submission endpoint to 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=submissions:10m rate=10r/m;
    # General API rate limit: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # ── Upstream: Go Backend ──────────────────
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # ── Upstream: Next.js Frontend ────────────
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Upstream: Grafana ─────────────────────
    upstream grafana {
        server grafana:3000;
    }

    # ── Main Server Block ─────────────────────
    server {
        listen 80;
        server_name _;

        # Max upload size (for code submissions)
        client_max_body_size 1m;

        # ── API Routes → Go Backend ───────────
        location /api/ {
            # Strip /api prefix before forwarding
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts (submissions can take up to 30s)
            proxy_connect_timeout 10s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;

            # Rate limiting for submission endpoint
            location /api/submissions {
                limit_req zone=submissions burst=5 nodelay;
                rewrite ^/api/(.*) /$1 break;
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }

        # ── Health Check (direct, no rate limit) ─
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Grafana ───────────────────────────
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Next.js Frontend (catch-all) ──────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Next.js hot reload WebSocket support
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Static Assets (Next.js) ───────────
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Error Pages ───────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error": "service_unavailable", "message": "Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
